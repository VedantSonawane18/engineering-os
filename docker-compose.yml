services:

  postgres:
    image: postgres:17
    container_name: engineering-os-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: engineering_os
      POSTGRES_USER: engineering_os
      POSTGRES_PASSWORD: engineering_os_dev

    ports:
      - "5432:5432"

    volumes:
      - engineering_os_postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineering_os -d engineering_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  engineering_os_postgres: